    <section id="contacto" class="contenedor">

        <section class="portada">
            <h1 id="tituloP">Contacto</h1>
            <p class="ofrezco text-center">Escríbeme y encuentra mi ubicación</p>
            <hr class="barraDeg">
        </section>
        
        <div class="container">
            <div class="row g-4">

                <article class="col-lg-12">
                    <div class="panel align-items-center">
                        <h2 class="text-center">Redes</h2>

                        <section class="redes flex-wrap">
                            <a  href="https://www.facebook.com/share/18URSuaEoC/">
                                <img src="image/facebook.png" alt="Feisbuk" id="img">
                            </a>
                            <a href="https://www.instagram.com/sy_wooliwebon?cplk=MWhndXFveWoxeTk4Zg==">
                                <img src="image/Instagram-Logo-PNG.png" alt="Insta" id="img">
                            </a>
                            <a href="https://www.tiktok.com/@wooliwebon?_r=1&_t=ZS-9Al7sXEOmwx">
                                <img src="image/TikTok-logo-2.png" alt="Tikitoki" id="img">
                            </a>
                            <a href="https://github.com/SYWooli">
                                <img src="image/GitHub.png" alt="Github" id="img">
                            </a>
                        </section>

                    </div>
                </article>

                <article class="col-lg-12">
                    <div class="panel">
                        <h2>Envíame un mensaje</h2>

                        <form action="">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label label">Nombre</label>
                                    <input type="text" class="form-control campo" required placeholder="Ej. José José">
                                </div>
                                <div class="col-md-6">
                                    <label for="apellidos" class="form-label label">Apellidos</label>
                                    <input type="text" class="form-control campo" required placeholder="Ej. Ramírez Ramírez">
                                </div>
                                <div class="col-md-6">
                                    <label for="correo" class="form-label label">Correo electrónico</label>
                                    <input type="email" class="form-control campo" required placeholder="usuario@gmail.com">
                                </div>
                                <div class="col-md-6">
                                    <label for="telefono" class="form-label label">Teléfono contacto (opcional)</label>
                                    <input type="tel" class="form-control campo" placeholder="10 dígitos">
                                </div>
                                <div class="col-12">
                                    <label for="asunto" class="form-label label">Asunto</label>
                                    <select class="form-select campo" required>
                                        <option class="bg-secondary" value="">Selecciona una opción</option>
                                        <option class="bg-secondary">Proyecto o colaboración</option>
                                        <option class="bg-secondary">Comentarios sobre mi portafolio</option>
                                        <option class="bg-secondary">Otro</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label for="mensaje" class="form-label label">Mensaje</label>
                                    <input class="form-control campo" rows="3" required placeholder="Escribe aquí tu mensaje..."></input>
                                </div>
                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" required>
                                        <label class="form-check-label">Acepto que mis datos se usen solo para responder este mensaje.</label>
                                    </div>
                                </div>
                                <div class="col-12 d-flex flex-wrap gap-3">
                                    <button type="submit" class="btn boton" aria-hidden="true">Enviar</button>
                                    <button type="reset" class="btn boton boton-claro">Limpiar</button>
                                </div>
                            </div>
                        </form>
                
                    </div>
                </article>

                <article class="col-lg-12">
                    <div class="panel h-100">
                        <h2>Mi cerro</h2>
                        <div class="mapa">

                        </div>
                    </div>
                </article>
